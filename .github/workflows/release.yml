name: Release

# Every push to main: if manifest.json has a version without a release yet,
# create the tag vX.Y.Z and a GitHub release with the notes from CHANGELOG.md.
# HACS then shows that version number and offers it as an update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from manifest.json
        id: v
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/vinyl_player/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Already released?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.v.outputs.tag }} exists – nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG.md
        if: steps.exists.outputs.skip != 'true'
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            index($0, "## [" v "]") == 1 || index($0, "## " v) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md" > notes.md; fi
          cat notes.md

      - name: Create tag and release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" --target "$GITHUB_SHA" \
            --title "${{ steps.v.outputs.tag }}" --notes-file notes.md
